# Airframe-1 coaxial candidate with the 3100 kV upper-rotor in-air motor-speed
# calibration supplied in log/电机标定/3100kv上桨_空中.csv.
#
# The CSV records physical actuator commands after the firmware's final x0.5
# motor-output map. The table below therefore uses 2 * command_normalized.
# The measured range is physical 5%-25% = controller-domain 0.10-0.50.
# Above 0.50 the upper-rotor curve is a linear continuation from the measured
# 0.50 point to the previous validated full-scale speed of 1200 rad/s; this is
# an explicit extrapolation, not an additional measured point.
#
# Both rotors intentionally use the same 3100 kV upper-rotor in-air table.
# This preserves coaxial torque symmetry in the command-to-speed model and is
# an explicit airframe-level policy, not an independently measured lower-rotor
# calibration.
#
# 2026-10-30 manual calibration from flight2/6:
# - ESC RPM + the calibrated thrust curve imply an effective mass of 0.65-0.68
#   kg. 0.66 kg is used as the centrally supported manual estimate.
# - The closed-loop servo-command to angular-acceleration response is much
#   stronger than the original conservative 0.00225 kg m^2 inertia. 0.00050
#   kg m^2 is used as the high-side estimate, deliberately avoiding an overly
#   aggressive gain design. The z/x inertia ratio is preserved.
# These are logging-derived manual estimates, not a precision identification.
schema_version: 1
seed: 20261029

parallel:
  independent_rng: true

timing:
  physics_hz: {value: 500}
  control_hz: {value: 500}

initial_state:
  position_n: {value: [0.0, 0.0, 0.0]}
  velocity_n: {value: [0.0, 0.0, 0.0]}
  attitude_q_wb: {value: [1.0, 0.0, 0.0, 0.0]}
  angular_velocity_b: {value: [0.0, 0.0, 0.0]}

body:
  mass: {value: 0.660}
  center_of_mass_b: {value: [0.0, 0.0, 0.0]}
  inertia_diagonal_b: {value: [0.00050, 0.00050, 0.0007333333]}

motors:
  - name: upper
    pwm_deadzone: {value: 0.08}
    pwm_to_rpm_table:
      value:
        - [0.0, 0.0]
        - [0.08, 0.0]
        - [0.1, 446.9910387405117]
        - [0.2, 578.3043756728091]
        - [0.3, 717.4114803798872]
        - [0.4, 831.9958364318189]
        - [0.5, 936.1972287636363]
        - [0.6, 988.9577830111091]
        - [0.8, 1093.4785018853827]
        - [1.0, 1200.0]
    time_constant: {value: 0.040}
    torque_coefficient: {value: 2.30e-8}
    noise:
      distribution: normal
      stddev: {value: 5.0}
  - name: lower
    pwm_deadzone: {value: 0.08}
    pwm_to_rpm_table:
      value:
        - [0.0, 0.0]
        - [0.08, 0.0]
        - [0.1, 446.9910387405117]
        - [0.2, 578.3043756728091]
        - [0.3, 717.4114803798872]
        - [0.4, 831.9958364318189]
        - [0.5, 936.1972287636363]
        - [0.6, 988.9577830111091]
        - [0.8, 1093.4785018853827]
        - [1.0, 1200.0]
    time_constant: {value: 0.050}
    torque_coefficient: {value: 2.30e-8}
    noise:
      distribution: normal
      stddev: {value: 5.0}

servos:
  - &servo
    name: servo_1
    pwm_angle_table:
      value: [[-1.0, -0.35], [0.0, 0.0], [1.0, 0.35]]
    tau: {value: 0.060}
    max_speed: {value: 11.6355}
    backlash: {value: 0.008}
    deadzone: {value: 0.015}
  - <<: *servo
    name: servo_2
  - <<: *servo
    name: servo_3

aerodynamics:
  thrust_coefficients: {value: [2.5736e-6, 2.5736e-6, 1.2868e-6]}
  neutral_thrust_direction_b: {value: [0.0, 0.0, -1.0]}
  direct_thrust_center_b: {value: [0.0, 0.0, 0.0]}
  thrust_partition:
    direct: {value: 0.65}
    grid_1: {value: 0.1166666667}
    grid_2: {value: 0.1166666667}
    grid_3: {value: 0.1166666666}
  grids:
    - &grid
      name: grid_1
      aerodynamic_center_b: {value: [-0.050, 0.0, 0.050]}
      deflection_axis_b: {value: [-1.0, 0.0, 0.0]}
      self_attenuation_curve:
        value: [[0.0, 1.0], [0.35, 0.85]]
      vector_deflection:
        gain: {value: 0.7}
        offset: {value: 0.0}
    - <<: *grid
      name: grid_2
      aerodynamic_center_b: {value: [0.025, 0.04330127, 0.050]}
      deflection_axis_b: {value: [0.5, 0.8660254, 0.0]}
    - <<: *grid
      name: grid_3
      aerodynamic_center_b: {value: [0.025, -0.04330127, 0.050]}
      deflection_axis_b: {value: [0.5, -0.8660254, 0.0]}
  coupling_attenuation:
    value:
      - [0.0, 0.15, 0.15]
      - [0.15, 0.0, 0.15]
      - [0.15, 0.15, 0.0]

sensors:
  gyro:
    sample_hz: {value: 500}
    noise:
      distribution: normal
      stddev: {value: [0.003, 0.003, 0.003]}
    bias: {value: [0.0, 0.0, 0.0]}
    delay: {value: 0.002}
    interpolation: linear
  accelerometer:
    sample_hz: {value: 500}
    noise:
      distribution: normal
      stddev: {value: [0.03, 0.03, 0.03]}
    bias: {value: [0.0, 0.0, 0.0]}
    delay: {value: 0.002}
    interpolation: linear
  motor_speed:
    sample_hz: {value: 500}
    noise:
      distribution: normal
      stddev: {value: [3.0, 3.0]}
    bias: {value: [0.0, 0.0]}
    delay: {value: 0.0}

logging:
  directory: ../logs/sim2real_micro_coaxial
  mode: compact
  physics_step_stride: 10
  chunk_steps: 1024
  queue_chunks: 2
  overflow: block
