schema_version: 1

# 2026-10-26 real-vehicle LQI deployment:
# - motor RPM feedback assumes 28 physical motor poles;
# - the final physical motor command remains 0.5 * controller command;
# - the calibrated motor table absorbs that output map (controller domain);
# - controller_config: stronger roll/pitch integral compensation for the
#   mechanical-zero trim bias (integral_state_scales 0.025/0.025/0.15,
#   integral_limit 0.45/0.45/0.90).
# - manual_reference: maximum roll/pitch command raised from 12 deg to 20 deg;
#   yaw-rate command unchanged.
# Paths are relative to the repository root.
simulator_config: SimEnv/configs/sim2real_micro_coaxial_20261026.yaml
controller_config: Controller/configs/lqi_sim2real_micro_coaxial_4out_20261026.yaml

# Must match nn_control/FinalMotorOutputMap.hpp.
final_motor_output_scale: 0.5
physical_motor_pole_count: 28

# PX4 manual-control reference contract. 20 deg matches the identification
# training envelope's maximum initial tilt (0.3490659 rad).
manual_reference:
  roll:
    limit_rad: 0.3490659
    time_constant_s: 0.18
  pitch:
    limit_rad: 0.3490659
    time_constant_s: 0.18
  yaw:
    limit_rad_s: 1.2
    time_constant_s: 0.25
