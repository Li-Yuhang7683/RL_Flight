schema_version: 1
airframe_id: airframe-1
airframe_registry: Identification/configs/airframes.yaml

simulator_config: SimEnv/configs/sim2real_micro_coaxial_3100kv_airframe1_manual_v2.yaml
controller_config: Controller/configs/lqi_coaxial_collective_servo_airframe1_manual_v3.yaml
identified_model:
  report: Identification/datasets/real_logs_26_10_26_v4/offline_identification_v7_hybrid_pq03.json
  expected_checksum: "0x1716d847"

motor_speed_calibration:
  path: log/电机标定/3100kv上桨_空中.csv
  shaft: upper
  mode: HARDWARE
  physical_command_to_controller_scale: 2.0
  measured_physical_command_range: [0.05, 0.25]
  measured_controller_command_range: [0.10, 0.50]
  above_range_extrapolation:
    method: linear_to_previous_full_scale
    previous_full_scale_rad_s: 1200.0

final_motor_output_scale: 0.5
physical_motor_pole_count: 28

manual_reference:
  roll:
    limit_rad: 0.3490659
    # Zero means pass the upstream command through without a first-order lag.
    time_constant_s: 0.0
  pitch:
    limit_rad: 0.3490659
    time_constant_s: 0.0
  yaw:
    limit_rad_s: 1.2
    time_constant_s: 0.0
