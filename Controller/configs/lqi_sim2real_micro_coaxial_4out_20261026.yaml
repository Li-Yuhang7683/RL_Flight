type: lqr
params:
  # Deployment contract: the upper rotor is owned by the pilot (virtual pilot
  # height PI during training); the LQR controls only lower_motor + servo_1/2/3.
  # 2026-10-26 calibration: motor-speed feedback and the final 0.5 output map
  # require substantially stronger roll/pitch rate damping. Yaw scales and all
  # actuator weights remain unchanged from the validated v2 controller.
  collective_mode: external_upper
  virtual_pilot:
    throttle:
      minimum: 0.20
      maximum: 0.96
      # Nominal hover throttle at 0.5 kg with the measured thrust curve.
      initial: 0.30
      spool_duration_s: 0.10
    height_controller:
      mode: pid
      target_m: 0.0
      # Competent-pilot altitude hold: throttle-domain PID with velocity damping.
      proportional_gain: 0.10
      integral_gain: 0.20
      derivative_gain: 0.08
      integral_limit: 1.0
      error_limit_m: 5.0
  pid:
    altitude:
      kp: 4.0
      ki: 0.8
      kd: 3.2
      integral_limit: 2.0
      minimum_thrust_fraction: 0.20
      maximum_thrust_fraction: 0.96
    attitude:
      roll_pitch_natural_frequency_rad_s: 6.0
      yaw_rate_bandwidth_rad_s: 5.0
      damping_ratio: 0.85
      integral_fraction: [0.08, 0.08, 0.04]
      integral_limit: [0.45, 0.45, 0.90]
      maximum_moment_n_m: [0.08, 0.08, 0.04]
  lqr:
    # p/q=0.3 trades a small amount of simulated convergence speed for more
    # phase margin against the real 5-7 Hz servo/backlash limit cycle.
    state_scales: [0.0872665, 0.0872665, 0.3, 0.3, 2.0, 300.0, 300.0, 0.15, 0.15, 0.15]
    integral_state_scales: [0.025, 0.025, 0.15]
    # Four controlled inputs: lower_motor, servo_1, servo_2, servo_3.
    input_scales: [0.16, 0.40, 0.40, 0.40]
    input_weight_scale: 0.08
  allocation:
    input_weights: [1.5, 1.5, 1.0, 1.0, 1.0]
    damping: 1.0e-5
